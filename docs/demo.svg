<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
  <title>commitron writing a commit message from a staged diff</title>
  <rect width="680" height="340" rx="10" fill="#0d1117"/>
  <rect width="680" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="680" height="10" fill="#161b22"/>
  <circle cx="18" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="17" r="6" fill="#27c93f"/>
  <text x="340" y="21" text-anchor="middle" fill="#8b949e" font-size="12">commitron</text>
  <g fill="#c9d1d9">
    <text x="24" y="60"><tspan fill="#8b949e">$ </tspan>git add .</text>
    <text x="24" y="82"><tspan fill="#8b949e">$ </tspan>commitron</text>
    <text x="24" y="104"><set attributeName="opacity" to="0" begin="0s" end="0.3s"/><tspan fill="#D56C4E">✳</tspan> <tspan fill="#f0f6fc">commitron</tspan> <tspan fill="#8b949e">· sonnet · 4 files</tspan> <tspan fill="#4FB286">+127</tspan> <tspan fill="#E06C5E">−43</tspan></text>

    <text x="24" y="126" fill="#D56C4E" opacity="0">⠋<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.4s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠙<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.48s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠹<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.56s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠸<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.64s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠼<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.72s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠴<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.8s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠦<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.88s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠧<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="0.96s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠇<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="1.04s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="24" y="126" fill="#D56C4E" opacity="0">⠏<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" calcMode="discrete" begin="1.12s" dur="0.8s" repeatCount="3" end="2.8s"/></text>
    <text x="41" y="126" fill="#8b949e" opacity="0">reading staged changes<set attributeName="opacity" to="1" begin="0.4s" end="0.8s"/></text>
    <text x="41" y="126" fill="#8b949e" opacity="0">asking sonnet 0.8s<set attributeName="opacity" to="1" begin="0.8s" end="1.6s"/></text>
    <text x="41" y="126" fill="#8b949e" opacity="0">asking sonnet 1.6s<set attributeName="opacity" to="1" begin="1.6s" end="2.4s"/></text>
    <text x="41" y="126" fill="#8b949e" opacity="0">asking sonnet 2.4s<set attributeName="opacity" to="1" begin="2.4s" end="2.8s"/></text>

    <text x="24" y="148"><set attributeName="opacity" to="0" begin="0s" end="2.8s"/>  <tspan fill="#D9A441">fix</tspan><tspan fill="#8b949e">(</tspan><tspan fill="#D9A441">orders</tspan><tspan fill="#8b949e">):</tspan> <tspan fill="#f0f6fc">reject items outside the supplier catalogue</tspan></text>
    <text x="24" y="192" fill="#8b949e"><set attributeName="opacity" to="0" begin="0s" end="2.8s"/>  - validate against the linked product list before pricing</text>
    <text x="24" y="214" fill="#8b949e"><set attributeName="opacity" to="0" begin="0s" end="2.8s"/>  - apply the rule on create and update, not only in the UI</text>

    <text x="24" y="258"><set attributeName="opacity" to="0" begin="0s" end="3.2s"/>  <tspan fill="#f0f6fc">commit?</tspan> <tspan fill="#8b949e">[Y/n/e=edit]</tspan> <tspan>y<set attributeName="opacity" to="0" begin="0s" end="3.9s"/></tspan></text>

    <text x="24" y="302"><set attributeName="opacity" to="0" begin="0s" end="4.3s"/>  <tspan fill="#4FB286">✓</tspan> <tspan fill="#f0f6fc">3f9c2a1</tspan> <tspan fill="#8b949e">committed</tspan></text>
  </g>
</svg>
