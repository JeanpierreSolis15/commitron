name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Set the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        run: |
          npm install -g npm@latest
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease ./*.tgz
