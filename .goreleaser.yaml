# brews:
#   - repository:
#       owner: JeanpierreSolis15
#       name: homebrew-tap
#       token: '{{ .Env.TAP_TOKEN }}'
#     homepage: https://github.com/JeanpierreSolis15/commitron
#     description: AI commit messages from your staged diff, via the Claude Code CLI
